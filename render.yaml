services:
  - type: web
    name: llm-moderator-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY  # ✅ ADDED - since you're using Groq
        sync: false
      - key: OPENAI_API_KEY  # optional
        sync: false
      - key: ADMIN_TOKEN  # legacy raw token for curl/export scripts (X-Admin-Token header)
        sync: false
      - key: ADMIN_USERNAME  # admin panel login (see server/admin_auth.py)
        sync: false
      - key: ADMIN_PASSWORD_HASH  # generate with: python admin_auth.py hash
        sync: false
      - key: ADMIN_SESSION_SECRET  # optional; derived from the password hash if unset
        sync: false
      - key: FRONTEND_URL
        value: https://llm-moderator-main-do.vercel.app/